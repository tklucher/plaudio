[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaudio"
version = "0.1.0"
description = "Sync new Plaud recordings into Google Docs (summary + full transcript)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "markdown>=3.5",
]

[project.scripts]
plaudio = "plaudio.cli:main"

[tool.setuptools]
packages = ["plaudio"]
