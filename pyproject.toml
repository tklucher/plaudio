[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaudio"
version = "0.2.0"
description = "Sync new Plaud recordings into Google Docs (summary + full transcript)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "markdown>=3.5",
]

[project.scripts]
plaudio = "plaudio.cli:main"

[project.gui-scripts]
plaudio-gui = "plaudio.gui:main"   # the desktop app (no console window on Windows)

[tool.setuptools]
packages = ["plaudio"]

[tool.setuptools.package-data]
plaudio = ["plaudio.ico"]
