name: Build Windows app

on:
  push:
    branches: [main, windows-gui]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the .exe to a GitHub Release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6"

      - name: Tests
        run: python tests/run.py

      - name: Check Plaud accepts PlaudIO sign-in (only for [plaud-probe] commits)
        if: contains(github.event.head_commit.message, '[plaud-probe]')
        shell: pwsh
        run: |
          python packaging/probe_plaud.py *> probe.log
          $code = $LASTEXITCODE
          Get-Content probe.log
          $msg = (Get-Content probe.log) -join '%0A'
          if ($code -ne 0) { Write-Output "::error title=Plaud probe::$msg"; exit $code }
          Write-Output "::warning title=Plaud probe::$msg"

      - name: Build PlaudIO.exe
        shell: pwsh
        run: |
          python packaging/build_exe.py *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log
          if ($code -ne 0) {
            # repeat the end of the log as one annotation so it shows on the run summary
            $tail = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Output "::error title=PyInstaller failed::$tail"
            exit $code
          }

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PlaudIO.exe -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) {
            $msg = (Get-Content selftest.txt) -join '%0A'
            Write-Output "::error title=Self-test failed::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PlaudIO-windows
          path: dist/PlaudIO.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlaudIO.exe
