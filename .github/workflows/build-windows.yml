name: Build Windows app

on:
  push:
    branches: [main, windows-gui]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the .exe to a GitHub Release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6"

      - name: Tests
        run: python tests/run.py

      - name: Build PlaudIO.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PlaudIO
          --icon plaudio\plaudio.ico
          --add-data "plaudio\plaudio.ico;."
          --collect-submodules mcp
          --collect-data googleapiclient
          --hidden-import googleapiclient.discovery
          --hidden-import google_auth_oauthlib.flow
          packaging\plaudio_gui.py

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PlaudIO.exe -ArgumentList "--self-test", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: PlaudIO-windows
          path: dist/PlaudIO.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlaudIO.exe
